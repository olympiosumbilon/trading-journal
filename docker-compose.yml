services:
  trading-journal:
    build: .
    container_name: pyow-trading-journal
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
      - ./uploads:/app/uploads
    networks:
      - n8n_default

networks:
  n8n_default:
    external: true