<!-- Interactive MTF Phase Roadmap & Structural Vision Modal -->
<div id="wlRoadmapModal" class="wl-chart-lightbox" style="display: none;" onclick="closeRoadmapModal(event)" role="dialog" aria-modal="true" aria-labelledby="roadmapModalTitle">
    <div class="wl-lightbox-box wl-roadmap-box" onclick="event.stopPropagation()">
        <div class="wl-lightbox-header wl-roadmap-header">
            <div class="wl-roadmap-tabs" role="tablist" aria-label="Roadmap structure views">
                <button type="button" id="tabBuyRoadmap" class="wl-rm-tab active" onclick="switchRoadmapTab('buying')" role="tab" aria-selected="true">
                    Buying Structure (Bullish Plan)
                </button>
                <button type="button" id="tabSellRoadmap" class="wl-rm-tab" onclick="switchRoadmapTab('selling')" role="tab" aria-selected="false">
                    Selling Structure (Bearish Plan)
                </button>
            </div>
            <div class="wl-roadmap-header-actions">
                <button type="button" class="wl-rm-action-btn" onclick="toggleRoadmapZoom()" id="roadmapZoomBtn" title="Toggle zoom fit / full size">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    <span id="roadmapZoomText">Zoom In</span>
                </button>
                <a id="roadmapFullLink" href="/static/images/photon_buying_structure.png" target="_blank" rel="noopener noreferrer" class="wl-rm-action-btn" title="Open full resolution diagram in new tab">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    <span>Full Resolution ↗</span>
                </a>
                <button type="button" class="wl-lightbox-close" onclick="closeRoadmapModal(event)" title="Close dialog (Esc)" aria-label="Close dialog">&times;</button>
            </div>
        </div>
        <div class="wl-roadmap-body">
            <div class="wl-roadmap-img-wrap" id="roadmapImgWrap" onclick="toggleRoadmapZoom()" title="Click image to toggle zoom fit / actual size">
                <img id="roadmapImg" src="/static/images/photon_buying_structure.png" alt="Photon MTF Phase Structure" loading="lazy">
            </div>
            <div class="wl-roadmap-phase-guide">
                <div class="rm-phase-pill phase-a" title="Phase A: Pro Swing + Pro Internal (Trend Run / Expansion)">
                    <span class="rm-badge flex-shrink-0">Phase A</span> 
                    <span class="rm-phase-desc">Pro Swing + Pro Internal (Trend Run / Expansion)</span>
                </div>
                <div class="rm-phase-pill phase-b" title="Phase B: Pro Swing + Counter Internal (End of Pullback / Reversal)">
                    <span class="rm-badge flex-shrink-0">Phase B</span> 
                    <span class="rm-phase-desc">Pro Swing + Counter Internal (End of Pullback / Reversal)</span>
                </div>
                <div class="rm-phase-pill phase-c" title="Phase C: Counter Swing + Pro Internal (Trading the Pullback)">
                    <span class="rm-badge flex-shrink-0">Phase C</span> 
                    <span class="rm-phase-desc">Counter Swing + Pro Internal (Trading the Pullback)</span>
                </div>
                <div class="rm-phase-pill phase-d" title="Phase D: Counter Swing + Counter Internal (Aggressive / Avoid)">
                    <span class="rm-badge flex-shrink-0">Phase D</span> 
                    <span class="rm-phase-desc">Counter Swing + Counter Internal (Aggressive / Avoid)</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function openRoadmapModal(type = 'buying') {
    const modal = document.getElementById('wlRoadmapModal');
    if (modal) {
        switchRoadmapTab(type);
        resetRoadmapZoom();
        modal.style.display = 'flex';
    }
}

function closeRoadmapModal(e) {
    if (!e || e.target.id === 'wlRoadmapModal' || e.target.classList.contains('wl-lightbox-close') || e.key === 'Escape') {
        const modal = document.getElementById('wlRoadmapModal');
        if (modal) modal.style.display = 'none';
        resetRoadmapZoom();
    }
}

function toggleRoadmapZoom() {
    const wrap = document.getElementById('roadmapImgWrap');
    const zoomText = document.getElementById('roadmapZoomText');
    if (!wrap) return;

    wrap.classList.toggle('zoomed-in');
    if (wrap.classList.contains('zoomed-in')) {
        if (zoomText) zoomText.textContent = 'Fit to Screen';
    } else {
        if (zoomText) zoomText.textContent = 'Zoom In';
    }
}

function resetRoadmapZoom() {
    const wrap = document.getElementById('roadmapImgWrap');
    const zoomText = document.getElementById('roadmapZoomText');
    if (wrap) wrap.classList.remove('zoomed-in');
    if (zoomText) zoomText.textContent = 'Zoom In';
}

function switchRoadmapTab(type) {
    const img = document.getElementById('roadmapImg');
    const fullLink = document.getElementById('roadmapFullLink');
    const tabBuy = document.getElementById('tabBuyRoadmap');
    const tabSell = document.getElementById('tabSellRoadmap');
    if (!img) return;

    resetRoadmapZoom();

    if (type === 'buying') {
        img.src = '/static/images/photon_buying_structure.png';
        if (fullLink) fullLink.href = '/static/images/photon_buying_structure.png';
        if (tabBuy) {
            tabBuy.classList.add('active');
            tabBuy.setAttribute('aria-selected', 'true');
        }
        if (tabSell) {
            tabSell.classList.remove('active');
            tabSell.setAttribute('aria-selected', 'false');
        }
    } else {
        img.src = '/static/images/photon_selling_structure.png';
        if (fullLink) fullLink.href = '/static/images/photon_selling_structure.png';
        if (tabSell) {
            tabSell.classList.add('active');
            tabSell.setAttribute('aria-selected', 'true');
        }
        if (tabBuy) {
            tabBuy.classList.remove('active');
            tabBuy.setAttribute('aria-selected', 'false');
        }
    }
}

// Escape key listener for roadmap modal
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' || e.keyCode === 27) {
        const roadmapModal = document.getElementById('wlRoadmapModal');
        if (roadmapModal && roadmapModal.style.display !== 'none') {
            closeRoadmapModal(e);
        }
    }
});
</script>
